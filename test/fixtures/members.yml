  encrypted_password: <%= Devise::Encryptor.digest(Member, 'password123') %>
  member_type: 1
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>

# Rejected Merchant Member (被拒絕商家)
