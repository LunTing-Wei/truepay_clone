# Customer Member (消費者)
one:
  email: customer@example.com
  encrypted_password: <%= Devise::Encryptor.digest(Member, 'password123') %>
  member_type: 0
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>

# Merchant Member (商家)
merchant_one:
  email: merchant@example.com
  encrypted_password: <%= Devise::Encryptor.digest(Member, 'password123') %>
  member_type: 1
  created_at: <%= 2.days.ago %>
  updated_at: <%= 2.days.ago %>

